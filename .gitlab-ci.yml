image: asciidoctor/docker-asciidoctor:latest

variables:
  GIT_DEPTH: "1"

pages:
  stage: deploy
  script:
    # Install necessary gems for PlantUML support
    - gem install asciidoctor-diagram

    # Create output directory
    - mkdir -p public

    # Process the AsciiDoc file with PlantUML support
    - asciidoctor -r asciidoctor-diagram -a imagesdir=images -a icons=font -D public index.adoc

    # Copy PlantUML files to public directory for reference
    - mkdir -p public/plantuml
    - cp -r plantuml/* public/plantuml/ || true

    # Create .nojekyll file to prevent Jekyll processing
    - touch public/.nojekyll
  artifacts:
    paths:
      - public
  only:
    - main # or 'master' depending on your default branch name
